server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Gzip compression ───────────────────────────────────────────────────────
  # Compresses JS, CSS, JSON, SVG, and HTML in transit.
  # Reduces network payload by 60–80 % for text assets.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2
    application/font-woff
    application/font-woff2;

  # ── Static assets (JS / CSS / fonts / images) ─────────────────────────────
  # Vite appends a content hash to every chunk filename, so we can safely
  # cache these for a full year.  Browsers will automatically fetch a new
  # file when the hash changes on the next deploy.
  location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
  }

  # ── SPA HTML entry point ────────────────────────────────────────────────────
  # Use no-cache (must revalidate) so browsers always check for a new index.html
  # on each navigation — but can still restore the page from bfcache during
  # back/forward navigation (no "no-store" which would block bfcache).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    # Explicit opt-in: tell browsers this page is safe to store in bfcache
    add_header Vary "Accept-Encoding";
  }

  # ── Backend API proxy ──────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Compress API JSON responses
    gzip_proxied any;
  }
}
