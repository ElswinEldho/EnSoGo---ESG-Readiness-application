<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/EnSoGo%20Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EnSoGo ESG Readiness Suite — Track, measure, and improve your organisation's sustainability performance." />
    <title>EnSoGo · ESG Readiness Suite</title>

    <!--
      ── Font: Inter from Google Fonts ─────────────────────────────────────────
      Strategy: non-blocking load.
        1. preconnect → browser opens TCP/TLS to both font origins immediately
        2. The stylesheet link starts with media="print" so it is NOT
           render-blocking (the parser skips it for screen rendering).
        3. onload swaps media to "all", applying the font rules once downloaded.
        4. <noscript> fallback ensures the font still loads without JavaScript.
        5. font-display:swap (in the URL) means text is shown in the system font
           instantly; Inter swaps in once ready — no blank-text flash.

      Net effect: eliminates the 382 ms → 819 ms render-blocking font cascade
      that Lighthouse flagged as the critical-path bottleneck.
    -->
    <!--
      ── LCP image preload ───────────────────────────────────────────────────────
      The EnSoGo logo is the Largest Contentful Paint element on the Login and
      Dashboard pages. Preloading it with high fetchpriority tells the browser
      to fetch it as early as possible (before CSS/JS parsing), cutting LCP by
      ~300–600 ms on typical connections.
    -->
    <link rel="preload" as="image" href="/EnSoGo%20Logo.png" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      font-display=optional: browser only uses Inter if it loads within the very
      first render window (i.e. it's already cached). On a cold load it falls
      back to the system font with no layout shift at all.
      Combined with the preconnect above, returning users see Inter immediately
      from the service-worker cache; first-time users see the system sans-serif
      — no FOUT reflow, CLS drops to 0 from font swap.
    -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional"
          media="print"
          onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=optional" />
    </noscript>

    <!--
      ── CDN preconnect for on-demand PDF libraries ─────────────────────────────
      Pre-resolve DNS + open TCP/TLS for the CDN that serves html2canvas and
      jsPDF (loaded lazily by pdfCapture.js only when the user clicks Export PDF).
      Eliminates ~200–400 ms of connection overhead at export time.
    -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
