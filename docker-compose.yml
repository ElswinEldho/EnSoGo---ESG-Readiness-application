services:
  mongo:
    image: mongo:7
    container_name: sam-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sam_assessment
    volumes:
      - mongo_data:/data/db
    networks: [sam-net]

  backend:
    build: ./backend
    container_name: sam-backend
    restart: unless-stopped
    depends_on: [mongo]
    ports:
      - "5000:5000"
    # Load defaults from the root .env, then override Docker-specific values below.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Use the Docker internal hostname for MongoDB (overrides .env value).
      MONGO_URI: mongodb://mongo:27017/sam_assessment
      # Uploads are stored in a named volume inside the container.
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
    networks: [sam-net]

  frontend:
    build:
      context: ./frontend
      args:
        # Read VITE_API_URL from the root .env (via docker-compose variable
        # interpolation) so the production API URL is baked into the build.
        # Falls back to localhost if the variable is not set.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: sam-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "5173:80"
    networks: [sam-net]

networks:
  sam-net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
